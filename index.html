<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Knight Online — Ortak Item Drop Sayacı</title>
  <style>
    :root {
      --bg-dark: #0c0e14;
      --bg-card: #151924;
      --bg-card-2: #1b2030;
      --accent-gold: #f5b82e;
      --accent-gold-dim: rgba(245, 184, 46, 0.16);
      --accent-red: #e04848;
      --accent-green: #2cc47c;
      --accent-blue: #4ea1ff;
      --text-main: #f2f4f8;
      --text-muted: #98a2b3;
      --border: rgba(255, 255, 255, 0.09);
      --radius: 14px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 0 0 88px 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      background: radial-gradient(circle at top, #1a1f30 0%, var(--bg-dark) 62%);
      color: var(--text-main);
      min-height: 100vh;
    }

    .container {
      max-width: 980px;
      margin: 0 auto;
      padding: 14px;
    }

    header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
      margin-bottom: 14px;
    }

    .brand h1 {
      margin: 0;
      font-size: 1.15rem;
      color: var(--accent-gold);
      letter-spacing: 0.3px;
    }

    .brand p {
      margin: 3px 0 0;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 6px 11px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 600;
      background: rgba(44, 196, 124, 0.14);
      color: var(--accent-green);
      border: 1px solid rgba(44, 196, 124, 0.3);
    }

    .status-pill.syncing {
      background: rgba(78, 161, 255, 0.14);
      color: var(--accent-blue);
      border-color: rgba(78, 161, 255, 0.3);
    }

    .status-pill.error {
      background: rgba(224, 72, 72, 0.14);
      color: #ff7b7b;
      border-color: rgba(224, 72, 72, 0.35);
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: currentColor;
    }

    .panel {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      margin-bottom: 14px;
    }

    .panel-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--accent-gold);
      margin: 0 0 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    input, select, button {
      font-family: inherit;
      font-size: 0.92rem;
      border-radius: 10px;
      border: 1px solid var(--border);
      outline: none;
    }

    input, select {
      background: var(--bg-card-2);
      color: var(--text-main);
      padding: 10px 12px;
    }

    input::placeholder {
      color: var(--text-muted);
    }

    input:focus, select:focus {
      border-color: var(--accent-gold);
    }

    button {
      cursor: pointer;
      padding: 10px 14px;
      font-weight: 600;
      color: var(--text-main);
      background: var(--bg-card-2);
      transition: transform 0.08s ease, opacity 0.15s ease, background 0.15s ease;
    }

    button:active {
      transform: scale(0.97);
    }

    .btn-gold {
      background: var(--accent-gold);
      color: #13151b;
      border-color: transparent;
    }

    .btn-green {
      background: var(--accent-green);
      color: #0b1912;
      border-color: transparent;
    }

    .btn-red {
      background: rgba(224, 72, 72, 0.18);
      color: #ff8585;
      border-color: rgba(224, 72, 72, 0.35);
    }

    .btn-sm {
      padding: 7px 10px;
      font-size: 0.8rem;
    }

    .char-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    .char-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 13px;
      border-radius: 999px;
      background: var(--bg-card-2);
      border: 1px solid var(--border);
      font-size: 0.88rem;
      font-weight: 600;
    }

    .char-chip.active {
      background: var(--accent-gold-dim);
      border-color: var(--accent-gold);
      color: var(--accent-gold);
    }

    .char-chip .remove-x {
      font-size: 0.78rem;
      opacity: 0.7;
      padding: 0 2px;
    }

    .items-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(265px, 1fr));
      gap: 12px;
    }

    .items-grid.compact {
      grid-template-columns: 1fr;
      gap: 8px;
    }

    .item-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 12px;
    }

    .items-grid.compact .item-card {
      flex-direction: row;
      align-items: center;
      padding: 10px 12px;
    }

    .item-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
    }

    .item-name-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .item-name {
      font-size: 1.02rem;
      font-weight: 700;
      color: var(--text-main);
      word-break: break-word;
    }

    .item-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .item-total {
      font-size: 1.35rem;
      font-weight: 800;
      color: var(--accent-gold);
      white-space: nowrap;
    }

    .items-grid.compact .item-total {
      font-size: 1.1rem;
    }

    .delete-item-btn {
      padding: 5px 8px;
      font-size: 0.78rem;
      line-height: 1;
      border-radius: 8px;
      background: rgba(224, 72, 72, 0.14);
      color: #ff8585;
      border: 1px solid rgba(224, 72, 72, 0.3);
    }

    .delete-item-btn:hover {
      background: rgba(224, 72, 72, 0.28);
    }

    .char-breakdown {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      font-size: 0.76rem;
      color: var(--text-muted);
    }

    .breakdown-tag {
      background: var(--bg-card-2);
      border: 1px solid var(--border);
      padding: 3px 8px;
      border-radius: 6px;
    }

    .drop-btn {
      width: 100%;
      padding: 12px;
      font-size: 0.96rem;
      font-weight: 800;
      background: linear-gradient(135deg, #f7c647, #e39f14);
      color: #14161c;
      border: none;
    }

    .items-grid.compact .drop-btn {
      width: auto;
      padding: 10px 16px;
      white-space: nowrap;
    }

    .history-list {
      max-height: 240px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .history-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      background: var(--bg-card-2);
      border: 1px solid var(--border);
      padding: 8px 11px;
      border-radius: 9px;
      font-size: 0.84rem;
    }

    .history-time {
      color: var(--text-muted);
      font-size: 0.75rem;
      white-space: nowrap;
    }

    .sticky-bar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(16, 20, 30, 0.95);
      backdrop-filter: blur(10px);
      border-top: 1px solid var(--border);
      padding: 10px 14px;
      z-index: 50;
    }

    .sticky-inner {
      max-width: 980px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .sticky-select {
      flex: 1;
      min-width: 0;
    }

    .toast {
      position: fixed;
      top: 16px;
      right: 16px;
      background: var(--bg-card-2);
      color: var(--text-main);
      border: 1px solid var(--accent-gold);
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 600;
      z-index: 100;
      opacity: 0;
      transform: translateY(-8px);
      transition: all 0.2s ease;
      pointer-events: none;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    .empty-state {
      text-align: center;
      color: var(--text-muted);
      padding: 24px 12px;
      border: 1px dashed var(--border);
      border-radius: var(--radius);
      font-size: 0.9rem;
    }
  </style>
</head>

        <button class="btn-green" id="copyLinkBtn">WhatsApp Linkini Kopyala</button>

      </div>
      <div class="char-chips" id="charChips"></div>
    </section>

    <!-- Item Ekleme -->

        <button class="btn-sm btn-red" id="resetCountsBtn">Sayıları Sıfırla</button>

    </section>

    <!-- Item Drop Kartları -->
    <section class="panel">
      <div class="panel-title">4. Canlı Drop Sayacı</div>
      <div class="items-grid" id="itemsGrid"></div>
    </section>

    <!-- Son Drop Geçmişi -->
    <section class="panel">
      <div class="panel-title">Son Düşen Droplar</div>
      <div class="history-list" id="historyList"></div>
    </section>
  </div>

  </div>
