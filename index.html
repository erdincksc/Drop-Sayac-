<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Knight Online — Ortak Item Drop Sayacı</title>
  <style>
    :root {
      --bg-dark: #0c0e14;
      --bg-card: #151924;
      --bg-card-2: #1b2030;
      --accent-gold: #f5b82e;
      --accent-gold-dim: rgba(245, 184, 46, 0.16);
      --accent-red: #e04848;
      --accent-green: #2cc47c;
      --accent-blue: #4ea1ff;
      --text-main: #f2f4f8;
      --text-muted: #98a2b3;
      --border: rgba(255, 255, 255, 0.09);
      --radius: 14px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 0 0 88px 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      background: radial-gradient(circle at top, #1a1f30 0%, var(--bg-dark) 62%);
      color: var(--text-main);
      min-height: 100vh;
    }

    .container {
      max-width: 980px;
      margin: 0 auto;
      padding: 14px;
    }

    header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
      margin-bottom: 14px;
    }

    .brand h1 {
      margin: 0;
      font-size: 1.15rem;
      color: var(--accent-gold);
      letter-spacing: 0.3px;
    }

    .brand p {
      margin: 3px 0 0;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 6px 11px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 600;
      background: rgba(44, 196, 124, 0.14);
      color: var(--accent-green);
      border: 1px solid rgba(44, 196, 124, 0.3);
    }

    .status-pill.syncing {
      background: rgba(78, 161, 255, 0.14);
      color: var(--accent-blue);
      border-color: rgba(78, 161, 255, 0.3);
    }

    .status-pill.error {
      background: rgba(224, 72, 72, 0.14);
      color: #ff7b7b;
      border-color: rgba(224, 72, 72, 0.35);
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: currentColor;
    }

    .panel {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      margin-bottom: 14px;
    }

    .panel-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--accent-gold);
      margin: 0 0 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    input, select, button {
      font-family: inherit;
      font-size: 0.92rem;
      border-radius: 10px;
      border: 1px solid var(--border);
      outline: none;
    }

    input, select {
      background: var(--bg-card-2);
      color: var(--text-main);
      padding: 10px 12px;
    }

    input::placeholder {
      color: var(--text-muted);
    }

    input:focus, select:focus {
      border-color: var(--accent-gold);
    }

    button {
      cursor: pointer;
      padding: 10px 14px;
      font-weight: 600;
      color: var(--text-main);
      background: var(--bg-card-2);
      transition: transform 0.08s ease, opacity 0.15s ease, background 0.15s ease;
    }

    button:active {
      transform: scale(0.97);
    }

    .btn-gold {
      background: var(--accent-gold);
      color: #13151b;
      border-color: transparent;
    }

    .btn-green {
      background: var(--accent-green);
      color: #0b1912;
      border-color: transparent;
    }

    .btn-red {
      background: rgba(224, 72, 72, 0.18);
      color: #ff8585;
      border-color: rgba(224, 72, 72, 0.35);
    }

    .btn-sm {
      padding: 7px 10px;
      font-size: 0.8rem;
    }

    .char-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    .char-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 13px;
      border-radius: 999px;
      background: var(--bg-card-2);
      border: 1px solid var(--border);
      font-size: 0.88rem;
      font-weight: 600;
    }

    .char-chip.active {
      background: var(--accent-gold-dim);
      border-color: var(--accent-gold);
      color: var(--accent-gold);
    }

    .char-chip .remove-x {
      font-size: 0.78rem;
      opacity: 0.7;
      padding: 0 2px;
    }

    .items-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(265px, 1fr));
      gap: 12px;
    }

    .items-grid.compact {
      grid-template-columns: 1fr;
      gap: 8px;
    }

    .item-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 12px;
    }

    .items-grid.compact .item-card {
      flex-direction: row;
      align-items: center;
      padding: 10px 12px;
    }

    .item-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
    }

    .item-name {
      font-size: 1.02rem;
      font-weight: 700;
      color: var(--text-main);
      word-break: break-word;
    }

    .item-total {
      font-size: 1.35rem;
      font-weight: 800;
      color: var(--accent-gold);
      white-space: nowrap;
    }

    .items-grid.compact .item-total {
      font-size: 1.1rem;
    }

    .char-breakdown {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      font-size: 0.76rem;
      color: var(--text-muted);
    }

    .breakdown-tag {
      background: var(--bg-card-2);
      border: 1px solid var(--border);
      padding: 3px 8px;
      border-radius: 6px;
    }

    .drop-btn {
      width: 100%;
      padding: 12px;
      font-size: 0.96rem;
      font-weight: 800;
      background: linear-gradient(135deg, #f7c647, #e39f14);
      color: #14161c;
      border: none;
    }

    .items-grid.compact .drop-btn {
      width: auto;
      padding: 10px 16px;
      white-space: nowrap;
    }

    .history-list {
      max-height: 240px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .history-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      background: var(--bg-card-2);
      border: 1px solid var(--border);
      padding: 8px 11px;
      border-radius: 9px;
      font-size: 0.84rem;
    }

    .history-time {
      color: var(--text-muted);
      font-size: 0.75rem;
      white-space: nowrap;
    }

    .sticky-bar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(16, 20, 30, 0.95);
      backdrop-filter: blur(10px);
      border-top: 1px solid var(--border);
      padding: 10px 14px;
      z-index: 50;
    }

    .sticky-inner {
      max-width: 980px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .sticky-select {
      flex: 1;
      min-width: 0;
    }

    .toast {
      position: fixed;
      top: 16px;
      right: 16px;
      background: var(--bg-card-2);
      color: var(--text-main);
      border: 1px solid var(--accent-gold);
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 600;
      z-index: 100;
      opacity: 0;
      transform: translateY(-8px);
      transition: all 0.2s ease;
      pointer-events: none;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    .empty-state {
      text-align: center;
      color: var(--text-muted);
      padding: 24px 12px;
      border: 1px dashed var(--border);
      border-radius: var(--radius);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="toast" id="toast"></div>

  <div class="container">
    <header>
      <div class="brand">
        <h1>⚔️ KO Ortak Item Drop Sayacı</h1>
        <p>Giriş/şifre yok • Anlık senkron • Kalıcı bulut kayıt</p>
      </div>
      <div class="status-pill syncing" id="statusPill">
        <span class="dot"></span>
        <span id="statusText">Bağlanıyor...</span>
      </div>
    </header>

    <!-- Oda ve Paylaşım -->
    <section class="panel">
      <div class="panel-title">1. Parti / Slot Odası</div>
      <div class="row">
        <input type="text" id="roomInput" placeholder="Oda adı (örn: paramun-1)" style="flex: 1; min-width: 170px;" />
        <button class="btn-gold" id="joinRoomBtn">Odaya Geç</button>
        <button class="btn-green" id="copyLinkBtn">WhatsApp Linkini Kopyala</button>
        <button class="btn-sm" id="toggleViewBtn">Görünüm: Kart</button>
      </div>
    </section>

    <!-- Karakterler -->
    <section class="panel">
      <div class="panel-title">2. Karakter İsimleri (Drop Kime Düştüyse Seç)</div>
      <div class="row">
        <input type="text" id="charInput" placeholder="Karakter adı yaz (örn: VeLskud)" style="flex: 1; min-width: 170px;" />
        <button class="btn-gold" id="addCharBtn">+ Karakter Ekle</button>
      </div>
      <div class="char-chips" id="charChips"></div>
    </section>

    <!-- Item Ekleme -->
    <section class="panel">
      <div class="panel-title">3. Takip Edilecek Item İsimleri</div>
      <div class="row">
        <input type="text" id="itemInput" placeholder="Item adı yaz (örn: Raptor, Shard, Bus)" style="flex: 1; min-width: 180px;" />
        <button class="btn-gold" id="addItemBtn">+ Item Ekle</button>
        <button class="btn-sm" id="copySummaryBtn">Özeti Kopyala</button>
        <button class="btn-sm btn-red" id="resetCountsBtn">Sayıları Sıfırla</button>
      </div>
    </section>

    <!-- Item Drop Kartları -->
    <section class="panel">
      <div class="panel-title">4. Canlı Drop Sayacı</div>
      <div class="items-grid" id="itemsGrid"></div>
    </section>

    <!-- Son Drop Geçmişi -->
    <section class="panel">
      <div class="panel-title">Son Düşen Droplar</div>
      <div class="history-list" id="historyList"></div>
    </section>
  </div>

  <!-- Mobil / Hızlı Alt Bar -->
  <div class="sticky-bar">
    <div class="sticky-inner">
      <select id="stickyCharSelect" class="sticky-select" aria-label="Aktif Karakter"></select>
      <button class="btn-sm" id="undoBtn">↩ Geri Al</button>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import {
      getFirestore,
      doc,
      onSnapshot,
      setDoc,
      updateDoc,
      arrayUnion
    } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCCkc5Na8C3Nux0Dqd16gBXHJ0fdLKx3YY",
      authDomain: "drop-sayaci-fa913.firebaseapp.com",
      projectId: "drop-sayaci-fa913",
      storageBucket: "drop-sayaci-fa913.firebasestorage.app",
      messagingSenderId: "1047650246816",
      appId: "1:1047650246816:web:ee25fa839ce69f391529c5",
      measurementId: "G-6LF59TH8DP"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const statusPill = document.getElementById("statusPill");
    const statusText = document.getElementById("statusText");
    const roomInput = document.getElementById("roomInput");
    const joinRoomBtn = document.getElementById("joinRoomBtn");
    const copyLinkBtn = document.getElementById("copyLinkBtn");
    const toggleViewBtn = document.getElementById("toggleViewBtn");
    const charInput = document.getElementById("charInput");
    const addCharBtn = document.getElementById("addCharBtn");
    const charChips = document.getElementById("charChips");
    const itemInput = document.getElementById("itemInput");
    const addItemBtn = document.getElementById("addItemBtn");
    const copySummaryBtn = document.getElementById("copySummaryBtn");
    const resetCountsBtn = document.getElementById("resetCountsBtn");
    const itemsGrid = document.getElementById("itemsGrid");
    const historyList = document.getElementById("historyList");
    const stickyCharSelect = document.getElementById("stickyCharSelect");
    const undoBtn = document.getElementById("undoBtn");
    const toastEl = document.getElementById("toast");

    function sanitizeRoom(name) {
      const cleaned = (name || "")
        .trim()
        .toLowerCase()
        .replace(/[^a-z0-9_-]/g, "-")
        .replace(/-+/g, "-")
        .replace(/^-|-$/g, "");
      return cleaned || "ko-genel-slot";
    }

    const urlParams = new URLSearchParams(window.location.search);
    let currentRoom = sanitizeRoom(urlParams.get("room") || localStorage.getItem("ko_last_room") || "ko-genel-slot");
    let activeChar = localStorage.getItem("ko_active_char") || "";
    let isCompactView = localStorage.getItem("ko_compact_view") === "1";
    let unsubscribeRoom = null;

    let roomState = {
      characters: ["Oyuncu 1", "Oyuncu 2"],
      items: ["Raptor", "Shard", "Bus"],
      // counts[itemName][charName] = number
      counts: {},
      history: []
    };

    function showToast(msg) {
      toastEl.textContent = msg;
      toastEl.classList.add("show");
      clearTimeout(showToast._timer);
      showToast._timer = setTimeout(() => toastEl.classList.remove("show"), 2000);
    }

    function setStatus(type, label) {
      statusPill.className = "status-pill " + type;
      statusText.textContent = label;
    }

    function updateUrlRoom(room) {
      const url = new URL(window.location.href);
      url.searchParams.set("room", room);
      window.history.replaceState({}, "", url.toString());
      localStorage.setItem("ko_last_room", room);
    }

    function ensureActiveChar() {
      if (!roomState.characters.length) {
        activeChar = "";
        return;
      }
      if (!activeChar || !roomState.characters.includes(activeChar)) {
        activeChar = roomState.characters[0];
      }
      localStorage.setItem("ko_active_char", activeChar);
    }

    function getItemTotal(itemName) {
      const byChar = roomState.counts?.[itemName] || {};
      return Object.values(byChar).reduce((acc, n) => acc + (Number(n) || 0), 0);
    }

    function renderAll() {
      roomInput.value = currentRoom;
      ensureActiveChar();
      itemsGrid.classList.toggle("compact", isCompactView);
      toggleViewBtn.textContent = isCompactView ? "Görünüm: Liste" : "Görünüm: Kart";

      // Karakter chipleri
      charChips.innerHTML = "";
      stickyCharSelect.innerHTML = "";

      if (!roomState.characters.length) {
        charChips.innerHTML = '<span style="color:var(--text-muted);font-size:0.85rem;">Henüz karakter eklenmedi.</span>';
        const opt = document.createElement("option");
        opt.value = "";
        opt.textContent = "Karakter ekleyin";
        stickyCharSelect.appendChild(opt);
      } else {
        roomState.characters.forEach((name) => {
          const chip = document.createElement("button");
          chip.type = "button";
          chip.className = "char-chip" + (name === activeChar ? " active" : "");
          chip.innerHTML = `
            <span>${escapeHtml(name)}</span>
            <span class="remove-x" title="Sil">✕</span>
          `;
          chip.addEventListener("click", (e) => {
            if (e.target.classList.contains("remove-x")) {
              e.stopPropagation();
              removeCharacter(name);
            } else {
              activeChar = name;
              localStorage.setItem("ko_active_char", activeChar);
              renderAll();
            }
          });
          charChips.appendChild(chip);

          const opt = document.createElement("option");
          opt.value = name;
          opt.textContent = "Aktif: " + name;
          if (name === activeChar) opt.selected = true;
          stickyCharSelect.appendChild(opt);
        });
      }

      // Item kartları
      itemsGrid.innerHTML = "";
      if (!roomState.items.length) {
        itemsGrid.innerHTML = '<div class="empty-state">Takip edilecek item ekleyin (örn: Raptor, Shard, Bus).</div>';
      } else {
        roomState.items.forEach((itemName) => {
          const total = getItemTotal(itemName);
          const byChar = roomState.counts?.[itemName] || {};

          const card = document.createElement("div");
          card.className = "item-card";

          const breakdownHtml = Object.entries(byChar)
            .filter(([, count]) => Number(count) > 0)
            .map(([cName, count]) => `<span class="breakdown-tag">${escapeHtml(cName)}: <b>${count}</b></span>`)
            .join("");

          card.innerHTML = `
            <div>
              <div class="item-top">
                <div class="item-name">${escapeHtml(itemName)}</div>
                <div class="item-total">${total}</div>
              </div>
              ${!isCompactView ? `<div class="char-breakdown" style="margin-top:8px;">${breakdownHtml || '<span style="opacity:0.65;">Henüz drop yok</span>'}</div>` : ""}
            </div>
            <button type="button" class="drop-btn" data-item="${escapeAttr(itemName)}">
              +1 DROP ${activeChar ? `(${escapeHtml(activeChar)})` : ""}
            </button>
          `;

          card.querySelector(".drop-btn").addEventListener("click", () => addDrop(itemName));
          itemsGrid.appendChild(card);
        });
      }

      // Geçmiş
      historyList.innerHTML = "";
      const recent = [...(roomState.history || [])].reverse().slice(0, 30);
      if (!recent.length) {
        historyList.innerHTML = '<div class="empty-state" style="padding:14px;">Henüz drop kaydı yok.</div>';
      } else {
        recent.forEach((entry) => {
          const div = document.createElement("div");
          div.className = "history-item";
          div.innerHTML = `
            <div>
              <b style="color:var(--accent-gold);">${escapeHtml(entry.charName || "Bilinmeyen")}</b>
              <span>→</span>
              <b>${escapeHtml(entry.itemName)}</b> (+1)
            </div>
            <div class="history-time">${escapeHtml(entry.timeStr || "")}</div>
          `;
          historyList.appendChild(div);
        });
      }
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function escapeAttr(str) {
      return String(str).replace(/"/g, "&quot;");
    }

    async function saveRoomState() {
      try {
        setStatus("syncing", "Kaydediliyor...");
        const ref = doc(db, "drop_rooms", currentRoom);
        await setDoc(ref, {
          characters: roomState.characters,
          items: roomState.items,
          counts: roomState.counts,
          history: (roomState.history || []).slice(-100),
          updatedAt: Date.now()
        }, { merge: true });
        setStatus("", "Canlı Bağlı (" + currentRoom + ")");
      } catch (err) {
        console.error(err);
        setStatus("error", "Kayıt Hatası");
        showToast("Veritabanına yazılamadı, Firestore kurallarını kontrol et.");
      }
    }

    function subscribeToRoom(room) {
      if (unsubscribeRoom) unsubscribeRoom();
      currentRoom = sanitizeRoom(room);
      updateUrlRoom(currentRoom);
      setStatus("syncing", "Senkronize ediliyor...");

      const ref = doc(db, "drop_rooms", currentRoom);
      unsubscribeRoom = onSnapshot(ref, async (snap) => {
        if (!snap.exists()) {
          roomState = {
            characters: ["Oyuncu 1", "Oyuncu 2"],
            items: ["Raptor", "Shard", "Bus"],
            counts: {},
            history: []
          };
          await saveRoomState();
        } else {
          const data = snap.data();
          roomState = {
            characters: Array.isArray(data.characters) ? data.characters : [],
            items: Array.isArray(data.items) ? data.items : [],
            counts: data.counts && typeof data.counts === "object" ? data.counts : {},
            history: Array.isArray(data.history) ? data.history : []
          };
        }
        setStatus("", "Canlı Bağlı (" + currentRoom + ")");
        renderAll();
      }, (err) => {
        console.error(err);
        setStatus("error", "Bağlantı Hatası");
      });
    }

    async function addCharacter() {
      const name = charInput.value.trim();
      if (!name) return;
      if (!roomState.characters.includes(name)) {
        roomState.characters.push(name);
        activeChar = name;
        localStorage.setItem("ko_active_char", activeChar);
        charInput.value = "";
        renderAll();
        await saveRoomState();
      } else {
        activeChar = name;
        charInput.value = "";
        renderAll();
      }
    }

    async function removeCharacter(name) {
      roomState.characters = roomState.characters.filter((c) => c !== name);
      ensureActiveChar();
      renderAll();
      await saveRoomState();
    }

    async function addItem() {
      const name = itemInput.value.trim();
      if (!name) return;
      if (!roomState.items.includes(name)) {
        roomState.items.push(name);
        if (!roomState.counts[name]) roomState.counts[name] = {};
        itemInput.value = "";
        renderAll();
        await saveRoomState();
      } else {
        showToast("Bu item zaten listede.");
      }
    }

    async function addDrop(itemName) {
      if (!activeChar) {
        showToast("Önce bir karakter seç veya ekle.");
        return;
      }
      if (!roomState.counts[itemName]) roomState.counts[itemName] = {};
      roomState.counts[itemName][activeChar] = (Number(roomState.counts[itemName][activeChar]) || 0) + 1;

      const now = new Date();
      const timeStr = now.toLocaleTimeString("tr-TR", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
      roomState.history.push({
        id: Date.now() + "_" + Math.random().toString(36).slice(2, 6),
        itemName,
        charName: activeChar,
        timeStr
      });

      if (navigator.vibrate) {
        navigator.vibrate(30);
      }

      renderAll();
      await saveRoomState();
      showToast(`+1 ${itemName} → ${activeChar}`);
    }

    async function undoLastDrop() {
      if (!roomState.history.length) {
        showToast("Geri alınacak kayıt yok.");
        return;
      }
      const last = roomState.history.pop();
      const cur = Number(roomState.counts?.[last.itemName]?.[last.charName]) || 0;
      if (cur > 0) {
        roomState.counts[last.itemName][last.charName] = cur - 1;
      }
      renderAll();
      await saveRoomState();
      showToast(`Geri alındı: ${last.itemName} (${last.charName})`);
    }

    async function resetCounts() {
      if (!confirm("Tüm drop sayıları ve geçmiş sıfırlansın mı?")) return;
      roomState.counts = {};
      roomState.history = [];
      renderAll();
      await saveRoomState();
      showToast("Sayılar sıfırlandı.");
    }

    function copySummary() {
      const lines = [`⚔️ KO Drop Özeti (Oda: ${currentRoom})`];
      roomState.items.forEach((itemName) => {
        const total = getItemTotal(itemName);
        const byChar = roomState.counts?.[itemName] || {};
        const detail = Object.entries(byChar)
          .filter(([, n]) => Number(n) > 0)
          .map(([c, n]) => `${c}: ${n}`)
          .join(", ");
        lines.push(`• ${itemName}: ${total}${detail ? ` (${detail})` : ""}`);
      });
      navigator.clipboard?.writeText(lines.join("\n"));
      showToast("Özet panoya kopyalandı!");
    }

    joinRoomBtn.addEventListener("click", () => subscribeToRoom(roomInput.value));
    roomInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") subscribeToRoom(roomInput.value);
    });

    copyLinkBtn.addEventListener("click", () => {
      const url = new URL(window.location.href);
      url.searchParams.set("room", currentRoom);
      navigator.clipboard?.writeText(url.toString());
      showToast("WhatsApp linki kopyalandı!");
    });

    toggleViewBtn.addEventListener("click", () => {
      isCompactView = !isCompactView;
      localStorage.setItem("ko_compact_view", isCompactView ? "1" : "0");
      renderAll();
    });

    addCharBtn.addEventListener("click", addCharacter);
    charInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") addCharacter();
    });

    addItemBtn.addEventListener("click", addItem);
    itemInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") addItem();
    });

    stickyCharSelect.addEventListener("change", (e) => {
      activeChar = e.target.value;
      localStorage.setItem("ko_active_char", activeChar);
      renderAll();
    });

    undoBtn.addEventListener("click", undoLastDrop);
    resetCountsBtn.addEventListener("click", resetCounts);
    copySummaryBtn.addEventListener("click", copySummary);

    subscribeToRoom(currentRoom);
  </script>
</body>
</html>
